name: Database migrations

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/migrations.yml'

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Apply every migration on a clean database
        run: supabase db reset --local
      - name: Lint database schema
        run: supabase db lint --local
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
